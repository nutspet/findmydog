allprojects {
    repositories {
        // jcenter() 已于 2021 年停止服务，改用 mavenCentral()
        google()
        mavenCentral()
    }
}

// 说明：Gradle 9 已移除 Project.buildDir，改用 layout.buildDirectory。
// 这里把构建产物仍统一放到 <工程根>/build（与旧版 rootProject.buildDir = '../build' 等价），
// Flutter 工具链按该路径查找产物。
def newBuildDir = rootProject.layout.buildDirectory.dir("../../build").get()

rootProject.layout.buildDirectory.value(newBuildDir)

subprojects {
    project.layout.buildDirectory.value(newBuildDir.dir(project.name))
}

subprojects {
    project.evaluationDependsOn(":app")
}

tasks.register("clean", Delete) {
    delete newBuildDir
}
