name: find_dog
description: 寻狗Flutter

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# Read more about versioning at semver.org.
#
# 注意：Android/iOS 的 versionName / versionCode 现在由这里派生
# （app/build.gradle 用 flutter.versionName / flutter.versionCode），
# 原来是硬编码在 app/build.gradle 的 1.0.2 / 2，这里对齐以保持版本号不变。
version: 1.0.2+2

environment:
  # 2026/10 迁移到 Flutter 3.47.6 (stable) / Dart 3.13.5。
  # 依赖中 cupertino_icons 2.x / cached_network_image 4.x / image_picker 1.x
  # 等均要求 Dart ^3.12.0，故此处下限取 3.12.0。
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^2.0.0
  # picker（原 flutter_picker 已停止维护且不支持 Dart 3，
  # 改用其官方延续分支 flutter_picker_plus，API 基本 1:1）
  flutter_picker_plus: ^1.5.6
  # dio（由 2.1.0 升到 5.x：修复 CVE-2021-31402 CRLF 注入）
  dio: ^5.11.1
  # 轮播（原 flutter_swiper 已停止维护，改用 card_swiper）
  card_swiper: ^3.0.1
  # 缓存图片 官方推荐
  cached_network_image: ^4.0.4
  # 日期要用 表单里
  intl: ^0.20.3
  # 设备id
  flutter_udid: ^4.1.6
  # 图片选择器
  image_picker: ^1.2.4
  # 地理位置
  geolocator: ^14.1.1
  # 官方webview
  webview_flutter: ^4.14.1
  # 微信分享
  fluwx: ^6.0.5
  # ===== 状态管理（列表页 BLoC 架构，由 xungou_x 重构版移植而来）=====
  # bloc 核心：直接用到 Bloc / Emitter / EventTransformer，所以要显式声明为直接依赖
  bloc: ^9.2.1
  # bloc 官方 Flutter 绑定：BlocProvider / BlocBuilder / BlocListener
  flutter_bloc: ^9.1.1
  # 事件并发策略（droppable 丢弃重复事件），0.3.0 对应 bloc ^9
  bloc_concurrency: ^0.3.0
  # 流变换工具，配合 bloc_concurrency 做 throttle
  stream_transform: ^2.1.2
  # 值相等语义（state / event 的比较基础），3.x 起不再自动比较 runtimeType
  equatable: ^3.0.0
  # ===== 地图（替换高德的 staticmap / geocode HTTP 接口）=====
  # 纯 Dart 实现的瓦片地图，无 platform view，不需要地图 SDK、不需要原生注册；
  # 底图用天地图（见 lib/common/tianditu.dart，tk 在 lib/common/constants.dart）。
  flutter_map: ^8.3.2
  # flutter_map 的经纬度类型。独立拆包，很多地图相关代码只依赖它。
  latlong2: ^0.10.1
  # 备注：已移除 amap_base —— 代码中从未 import 且该包已停止维护。
  # 原先实际用的是高德两个 HTTP 接口，现已全部换成天地图：
  #   * 静态图 restapi.amap.com/v3/staticmap  → flutter_map + 天地图矢量瓦片（map.dart）
  #   * 地理编码 restapi.amap.com/v3/geocode/geo → 天地图 geocoder（report.dart）
  # 已移除 path_provider —— 代码中无直接引用（cached_network_image 缓存栈会间接引入）。

dev_dependencies:
  flutter_test:
    sdk: flutter

  # 官方推荐 lint 规则集
  flutter_lints: ^6.0.0


# For information on the generic Dart part of this file, see the
# following page: https://www.dartlang.org/tools/pub/pubspec

# The following section is specific to Flutter.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  # assets:
  #  - images/a_dot_burr.jpeg
  #  - images/a_dot_ham.jpeg
  assets:
      - data_repo/img/bar/lost.png
      - data_repo/img/bar/planet.png
      - data_repo/img/bar/my.png
      - data_repo/img/logo/logo.png
      - data_repo/img/logo/wx.png
      - data_repo/img/grid/icecream-04.png
      - data_repo/img/grid/icecream-12.png
      - data_repo/img/grid/icecream-14.png
      - data_repo/img/grid/icecream-16.png
      - data_repo/img/my/clock.png
      - data_repo/img/my/plant.png
      - data_repo/img/my/pen&ruler.png


  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.io/assets-and-images/#resolution-aware.

  # For details regarding adding assets from package dependencies, see
  # https://flutter.io/assets-and-images/#from-packages

